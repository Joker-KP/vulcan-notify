# Two services off one image. They used to be one container where entrypoint.sh
# forked the API into the background: if the API died, bash (PID 1) survived, so
# `restart: unless-stopped` never fired and port 8585 stayed dead indefinitely.
# Split apart, each process is supervised on its own.
x-common: &common
  build: .
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./data:/app/data
  environment:
    DB_PATH: /app/data/vulcan_notify.db
    SESSION_FILE: /app/data/session.json
    # Deliberately NOT setting TZ. Every stamp in the DB is a naive datetime.now(),
    # so moving the container clock would leave old rows on UTC and write new ones on
    # local time -- a phantom two-hour jump in data age on the first health check
    # after deploy, which is precisely the false 503 this change exists to stop.
    # The clock stays UTC; only the quiet window is evaluated in local time.
    QUIET_HOURS_TZ: "${QUIET_HOURS_TZ:-Europe/Warsaw}"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  vulcan-api:
    <<: *common
    container_name: vulcan-api
    command: ["uv", "run", "python", "-m", "vulcan_notify.api"]
    ports:
      - "8585:8585"
    healthcheck:
      # Deliberately /api/alive, not /api/health. Liveness and freshness are
      # different questions: when Vulcan is down the data is stale but this
      # container is fine, and marking it unhealthy would be a lie. Freshness is
      # pve-healthcheck's job, via /api/health's 503.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8585/api/alive', timeout=5)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  vulcan-sync:
    <<: *common
    container_name: vulcan-sync
    environment:
      DB_PATH: /app/data/vulcan_notify.db
      SESSION_FILE: /app/data/session.json
      QUIET_HOURS_TZ: "${QUIET_HOURS_TZ:-Europe/Warsaw}"
      DISPLAY: ":99"
      VULCAN_BROWSER_PROFILE_DIR: /app/data/chromium-profile
      VULCAN_BROWSER_LOCK_FILE: /app/data/chromium-profile.lock
      VULCAN_BROWSER_HEADLESS: "${VULCAN_BROWSER_HEADLESS:-false}"
      VULCAN_BROWSER_SLOW_MO_MS: "${VULCAN_BROWSER_SLOW_MO_MS:-0}"
    entrypoint: ["./entrypoint-xvfb.sh"]
    command: ["./sync-loop.sh"]

  # Manual authentication / diagnostic browser.
  #
  # Start only explicitly:
  #
  # docker compose --profile auth up vulcan-auth
  #
  vulcan-auth:
    container_name: vulcan-auth

    <<: *common

    profiles:
      - auth

    restart: "no"

    env_file:
      - .env

    environment:
      DISPLAY: ":99"

      DB_PATH: /app/data/vulcan_notify.db
      SESSION_FILE: /app/data/session.json

      VULCAN_BROWSER_PROFILE_DIR: /app/data/chromium-profile
      VULCAN_BROWSER_LOCK_FILE: /app/data/chromium-profile.lock
      QUIET_HOURS_TZ: "${QUIET_HOURS_TZ:-Europe/Warsaw}"
      VULCAN_BROWSER_HEADLESS: "false"

    volumes:
      - ./data:/app/data

    ports:
      - "127.0.0.1:6080:6080"

    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        export DISPLAY=:99

        echo "[auth-gui] DISPLAY=$$DISPLAY"
        echo "[auth-gui] Starting Xvfb..."

        rm -f /tmp/.X99-lock || true

        Xvfb :99 \
          -screen 0 1440x900x24 \
          -ac \
          +extension RANDR \
          >/tmp/xvfb.log 2>&1 &

        # Do not rely only on sleep; wait until the X11 socket exists.
        for i in $$(seq 1 20); do
          if [ -S /tmp/.X11-unix/X99 ]; then
            echo "[auth-gui] X server ready."
            break
          fi

          sleep 0.5
        done

        if [ ! -S /tmp/.X11-unix/X99 ]; then
          echo "[auth-gui] ERROR: Xvfb did not create X11 socket."
          cat /tmp/xvfb.log || true
          exit 1
        fi

        echo "[auth-gui] Starting Openbox..."

        openbox \
          >/tmp/openbox.log 2>&1 &

        sleep 1

        echo "[auth-gui] Starting x11vnc..."

        x11vnc \
          -display :99 \
          -forever \
          -shared \
          -nopw \
          -listen 127.0.0.1 \
          -rfbport 5900 \
          >/tmp/x11vnc.log 2>&1 &

        sleep 1

        echo "[auth-gui] Starting noVNC..."

        websockify \
          --web=/usr/share/novnc \
          6080 \
          127.0.0.1:5900 \
          >/tmp/novnc.log 2>&1 &

        sleep 1

        echo
        echo "====================================================="
        echo " eduVULCAN persistent authentication browser"
        echo
        echo " DISPLAY=$$DISPLAY"
        echo " Profile: $$VULCAN_BROWSER_PROFILE_DIR"
        echo
        echo " SSH tunnel:"
        echo "   ssh -L 6080:127.0.0.1:6080 USER@VPS"
        echo
        echo " Browser:"
        echo "   http://127.0.0.1:6080/vnc.html"
        echo "====================================================="
        echo

        exec uv run vulcan-notify auth
