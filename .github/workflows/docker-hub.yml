name: Build / publish Docker Hub image (manual)

# No push, tag or scheduled trigger: publication is an explicit maintainer action.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from pyproject.toml (e.g. 0.20.0)
        required: true
        type: string
      publish:
        description: Publish the built image to macjoker/vulcan-notify
        type: boolean
        default: false
      update_latest:
        description: Also tag this build as latest (only published if publish is true)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-hub-release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Validate version and prepare tags
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-.][a-zA-Z0-9_.-]+)?", version):
              raise SystemExit("Use a version tag such as 0.20.0, without a v prefix.")
          if version != project["version"]:
              raise SystemExit("The requested version must match pyproject.toml.")
          tags = [f"macjoker/vulcan-notify:{version}"]
          if os.environ["UPDATE_LATEST"] == "true":
              tags.append("macjoker/vulcan-notify:latest")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tags={','.join(tags)}\n")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          username: macjoker
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (publish only when requested)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.description=Self-hosted eduVULCAN synchronization and notifications
          cache-from: type=gha
          cache-to: type=gha,mode=max
